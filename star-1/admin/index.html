<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Verwaltung – Star 1 Coiffeur</title>
  <meta name="theme-color" content="#faf8f4">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="adm">

<!-- Login -->
<section class="login" id="login" hidden>
  <form class="login__card" id="login-form">
    <img src="../assets/img/logo-dunkel.webp" alt="Star 1 Coiffeur" width="800" height="253">
    <h1>Verwaltung</h1>
    <p>Melden Sie sich an, um Termine, Team und Preise zu verwalten.</p>
    <div class="field"><label for="l-user">Benutzername</label><input id="l-user" name="username" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">Passwort</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required></div>
    <div class="form__msg" aria-live="assertive"></div>
    <button class="btn" type="submit">Anmelden</button>
    <a class="login__back" href="../">← Zur Webseite</a>
  </form>
</section>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side theme-dark">
    <a class="side__logo" href="../" target="_blank" title="Webseite öffnen"><img src="../assets/img/logo-weiss.webp" alt="Star 1 Coiffeur"></a>
    <nav class="side__nav" id="side-nav">
      <a href="#kalender" data-view="kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Tagesplan</a>
      <a href="#termine" data-view="termine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Alle Termine</a>
      <a href="#team" data-view="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Mitarbeiter</a>
      <a href="#leistungen" data-view="leistungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>Leistungen &amp; Preise</a>
      <a href="#zeiten" data-view="zeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Öffnungszeiten</a>
      <a href="#abwesenheiten" data-view="abwesenheiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>Abwesenheiten</a>
      <a href="#konto" data-view="konto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Konto</a>
    </nav>
    <div class="side__foot">
      <span id="who"></span>
      <button class="btn btn--ghost btn--sm" id="logout" type="button">Abmelden</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- Dialog -->
<dialog class="modal" id="modal">
  <form method="dialog" class="modal__card" id="modal-form" novalidate>
    <header class="modal__head"><h2 id="modal-title"></h2><button class="icon-btn" value="cancel" formnovalidate aria-label="Schliessen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
    <div class="modal__body" id="modal-body"></div>
    <div class="form__msg" id="modal-msg" aria-live="assertive"></div>
    <footer class="modal__foot" id="modal-foot"></footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/admin.js" defer></script>
</body>
</html>
